.panel{border:1px solid #ffffffcc;background:#fffffff2;box-shadow:0 16px 40px #1a596040}

const missions=[
{title:'الكلمات تترك أثرًا',emoji:'💬',q:'لاحظت أن بعض الطلاب ينادون زميلًا بلقب يزعجه كل يوم. ماذا تفعل؟',opts:['أضحك معهم حتى لا أغضبهم','أرفض السخرية وأساند زميلي وأخبر المعلم','أصوّر الموقف وأشاركه'],ok:1,why:'تكرار الإيذاء المقصود قد يكون تنمرًا. المساندة وطلب مساعدة المعلم تصرف شجاع.'},
{title:'قوة ضبط النفس',emoji:'🧠',q:'أخذ زميلك دورك في اللعبة دون إذن، وشعرت بالغضب. ما الأفضل؟',opts:['أدفعه فورًا','أصرخ وأهينه','أهدأ وأشرح له حقي بكلام محترم'],ok:2,why:'يمكنك التعبير عن الغضب دون عنف؛ الهدوء والحوار يحفظان الحقوق.'},
{title:'صديق جديد',emoji:'🤝',q:'طالب جديد يجلس وحده أثناء الفسحة. كيف تطبق قيمة الرفق؟',opts:['أدعوه للانضمام إلى اللعب وأرحب به','أتجاهله','أطلب من الآخرين الابتعاد عنه'],ok:0,why:'الترحيب والتعاون واحترام الآخرين يساعد في بناء بيئة مدرسية آمنة.'},
{title:'هل هو تنمر؟',emoji:'🔎',q:'اختلف طالبان مرة واحدة في مباراة ثم اعتذرا. هل كل خلاف عابر يُعد تنمرًا؟',opts:['نعم، كل خلاف تنمر','لا، فالتنمر يتضمن إيذاءً متعمدًا ومتكررًا','نعم، إذا كان في المدرسة'],ok:1,why:'يميز الدليل التنمر بتعمد الإيذاء وتكراره واختلال القوة، وليس كل خلاف عابر تنمرًا.'},
{title:'الشاهد الشجاع',emoji:'🛡️',q:'رأيت طالبًا يتعرض للدفع والتهديد. ما التصرف الآمن؟',opts:['أتدخل بالضرب للدفاع عنه','أشجع الآخرين على المشاهدة','أبتعد عن الخطر وأبلغ المعلم أو المسؤول فورًا'],ok:2,why:'لا تعرض نفسك للخطر؛ اطلب تدخل شخص بالغ مسؤول لمساعدة الطالب.'},
{title:'رفق في العالم الرقمي',emoji:'📱',q:'انتشرت في مجموعة الصف صورة تسخر من طالب. ما الأفضل؟',opts:['أعيد إرسالها لأصدقائي','لا أنشرها وأبلغ شخصًا بالغًا موثوقًا','أكتب تعليقًا ساخرًا'],ok:1,why:'عدم المشاركة في الإساءة وطلب المساعدة يحدان من الأذى النفسي والاجتماعي. هذا تطبيق توعوي لمبادئ الدليل.'},
{title:'احترام الممتلكات',emoji:'🎒',q:'أغضبك زميلك وفكرت في إتلاف حقيبته. ماذا تختار؟',opts:['أتلفها حتى يتعلم','أخفيها للانتقام','أترك ممتلكاته وأحل الخلاف بالحوار'],ok:2,why:'العنف قد يشمل الإضرار المتعمد بالممتلكات، والحوار بديل سليم.'},
{title:'لا تبقَ صامتًا',emoji:'🌟',q:'صديقك يخبرك أن طالبًا يهدده باستمرار ويطلب منك كتمان الأمر. ماذا تفعل؟',opts:['أساعده على إخبار الموجه الطلابي أو المعلم الموثوق','أعده بألا أخبر أحدًا مهما حدث','أطلب منه الرد بالتهديد'],ok:0,why:'عند وجود تهديد متكرر، طلب المساعدة يحمي صديقك. لا تعده بكتمان ما يعرضه للأذى.'}

let idx=0,score=0,student='',answered=false,soundOn=true;const app=document.getElementById('app');function beep(good=true){if(!soundOn)return;try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=good?650:240;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.2)}catch(e){}}function toggleSound(){soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 الصوت مفعّل':'🔇 الصوت مغلق'}function start(){let n=document.getElementById('name').value.trim();if(!n){alert('اكتب اسم البطل أولًا');return}student=n.slice(0,60);idx=0;score=0;showQ()}function home(){app.innerHTML=`<div class="hero">🛡️🎒✨</div><span class="pill">تحدّي أبطال الرفق</span><h1>مغامرات رفق</h1><h2>أبطال المدرسة الآمنة</h2><p class="school">مدرسة ابن حوقل الابتدائية</p><p>ثماني مهمات ممتعة! اتخذ القرار الصحيح، واجمع النجوم، واحصل على شهادة بطل الرفق.</p><input id="name" placeholder="اكتب اسم الطالب هنا" maxlength="60" aria-label="اسم الطالب"><div><button class="btn" onclick="start()">🚀 ابدأ المغامرة</button></div><p style="font-size:13px">اختر الإجابة ثم اقرأ التفسير التعليمي قبل الانتقال للمهمة التالية.</p>`}function showQ(){answered=false;let m=missions[idx];app.innerHTML=`<div class="pill">المهمة ${idx+1} من ${missions.length}</div><div class="progress"><div style="width:${idx/missions.length*100}%"></div></div><div class="score">⭐ نقاطك: ${score}</div><div class="hero">${m.emoji}</div><h2>${m.title}</h2><p style="font-size:19px;font-weight:bold">${m.q}</p><div class="options">${m.opts.map((x,i)=>`<button class="option" onclick="choose(${i})">${['أ','ب','ج'][i]}) ${x}</button>`).join('')}</div><div id="response"></div>`}function choose(i){if(answered)return;answered=true;let m=missions[idx],correct=i===m.ok;if(correct)score+=10;beep(correct);document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===m.ok)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.querySelector('.score').textContent='⭐ نقاطك: '+score;document.getElementById('response').innerHTML=`<div class="feedback"><strong>${correct?'🌟 أحسنت! إجابة صحيحة':'💡 محاولة جيدة، تعلّم الإجابة الصحيحة'}</strong><p>${m.why}</p></div><button class="btn" onclick="next()">${idx===missions.length-1?'🏆 عرض النتيجة':'المهمة التالية ←'}</button>`}function next(){idx++;if(idx<missions.length)showQ();else finish()}function finish(){let pct=Math.round(score/(missions.length*10)*100);app.innerHTML=`<div class="hero">🏆🎉</div><h1>أنهيت مغامرات رفق!</h1><p>جميل يا بطل! كل اختيار واعٍ يصنع مدرسة أكثر أمانًا.</p><div class="cert"><div style="font-size:45px">🏅</div><h2>شهادة بطل الرفق</h2><p>تُمنح للطالب</p><h2 id="certname"></h2><p>لمشاركته في تحدّي «أبطال المدرسة الآمنة»</p><h2>⭐ ${score} / 80 — ${pct}%</h2><p>معًا نحو مدرسة يسودها الاحترام والتسامح والرفق</p><small>وزارة التعليم — مدرسة ابن حوقل الابتدائية — برنامج رفق</small></div><button class="btn" onclick="window.print()">🖨️ طباعة الشهادة / حفظ PDF</button><button class="btn secondary" onclick="home()">🔄 العب من جديد</button>`;document.getElementById('certname').textContent=student}home();
